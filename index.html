@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0d;
  --panel: rgba(255,255,255,0.025);
  --border: rgba(255,255,255,0.08);
  --gold: #E8B64C;
  --gold-dim: rgba(232,182,76,0.12);
  --text: #e2e8f0;
  --muted: #9aa7bd;
  --faint: #9aa8c2;
  --green: #10b981;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --cyan: #1fd3ee;
  --accent: #E8B64C;          /* switches per business in render() */
  --accent-dim: rgba(232,182,76,0.12);
  --accent-brd: rgba(232,182,76,0.35);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
}
h1,h2,h3,.syne { font-family: 'Syne', sans-serif; }
button, input, select, textarea { font-family: inherit; }
input, select, textarea {
  width: 100%; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
  padding: 9px 12px; color: var(--text); font-size: 15px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
::placeholder { color: #8794ab; }
.btn {
  border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px;
  font-weight: 800; cursor: pointer; letter-spacing: 0.06em;
  font-family: 'DM Mono', monospace;
}
.btn-red { background: var(--accent); color: #0d0d10; }
.btn-ghost { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
.btn-dashed {
  background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.14);
  color: var(--muted); width: 100%; padding: 10px; border-radius: 8px;
  cursor: pointer; font-size: 13px; letter-spacing: 0.08em;
}
.btn-dashed:hover { border-color: var(--accent); color: var(--accent); }
.autofill-actions {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px; margin-bottom: 8px;
}
.autofill-actions .btn { min-height: 60px; padding: 10px 8px; }
@media (max-width: 620px) {
  .autofill-actions { grid-template-columns: 1fr; gap: 8px; }
  .autofill-actions .btn { min-height: 48px; }
}
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.chip {
  font-size: 11px; letter-spacing: 0.18em; padding: 2px 7px; border-radius: 4px;
  display: inline-block; font-weight: 700;
}
.section-title { font-size: 12px; letter-spacing: 0.3em; color: #94a3b8; font-weight: 700; margin: 4px 0 12px; }
.del-x {
  background: transparent; border: none; color: #8794ab; font-size: 16px;
  cursor: pointer; padding: 2px 6px; opacity: 0.55;
}
.del-x:hover { color: #ef4444; opacity: 1; }
.empty {
  padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px;
  border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px;
}
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes fadeout { to { opacity: 0; visibility: hidden; } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

/* ===== Splash ===== */
#splash {
  position: fixed; inset: 0; background: #050506; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeout 0.7s ease 1.5s forwards;
}
#splash .logo-wrap { width: min(560px, 86vw); }

/* ===== Watermark ===== */
#watermark {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 0; opacity: 0.05;
}
#watermark .logo-wrap { width: min(520px, 85vw); }

/* ===== Layout ===== */
#shell { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 26px 16px 60px; }
header.app { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
header.app .logo-wrap { width: min(440px, 86vw); margin: 0 auto; cursor: pointer; }
.biz-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.biz-tab {
  padding: 13px 10px; border-radius: 10px; cursor: pointer; text-align: center;
  border: 1px solid var(--border); background: var(--panel);
  font-size: 14px; letter-spacing: 0.12em; color: var(--muted); font-weight: 800;
  transition: all .2s;
}
.biz-tab.active { color: #fff; }
.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.sub-tab {
  padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
  letter-spacing: 0.1em; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-weight: 700;
}
.sub-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 10px; text-align: center;
}
.stat .lbl { font-size: 12px; color: var(--faint); letter-spacing: 0.1em; margin-bottom: 6px; }
.stat .val { font-family: 'DM Mono', monospace; font-size: 23px; font-weight: 800; }
.row { display: flex; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.form-panel {
  background: var(--accent-dim); border: 1px solid var(--accent-brd);
  border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 9px;
  margin-bottom: 12px;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
#bgCorner { position: fixed; right: 14px; bottom: 12px; z-index: 50; display: flex; gap: 6px; opacity: 0.4; transition: opacity .2s; }
#bgCorner:hover { opacity: 1; }

</div>

// ---------- State ----------
let _state = null;
function state() { return _state; }
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { _state = JSON.parse(raw); migrate(); return; }
  } catch(e) {}
  _state = defaultState();
  migrate();
}
function migrate() { // add keys introduced after first release
  _state.catalog ||= { centauri: [], keypr: [] };
  _state.catalogMeta ||= {};
  _state.docs ||= {};
  _state.bp ||= {};
  _state.fin ||= {};
  _state.strength ||= {};
  _state.strengthData ||= {};
  _state.strengthFiles ||= {};
  _state.tabNames ||= {};
  _state.bizNames ||= {};
  for (const b of ["centauri","keypr"]) {
    _state.fin[b] ||= {};
    _state.strength[b] ||= {};
    _state.strengthData[b] ||= {};
    _state.strengthFiles[b] ||= {};
    _state.catalog[b] ||= [];
    _state.catalogMeta[b] ||= { lastSync: null, source: "", srcUrl: "" };
    _state.docs[b] ||= { files: [], links: [], dnb: defaultDnb(), scan: { files: [], lastScan: null, folderName: "" } };
    _state.bp[b] ||= {};
    _state.docs[b].web ||= [];
    _state.docaiHistory ||= {};
    _state.docaiHistory[b] ||= {};
    const old = _state.profiles && _state.profiles[b];
    if (old) { // carry legacy profile values into the structured profile
      const m = _state.bp[b];
      m.legalName ||= old.legal || ""; m.brands ||= old.brands || "";
      m.colors ||= old.colors || ""; m.notes ||= old.notes || "";
      m.marketplaces ||= old.marketplaces || ""; m.keyIds ||= old.ids || "";
    }
  }

function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(_state)); } catch(e) { console.error(e); } scheduleCloudWrite(); }

// ===== CLOUD SYNC (Firebase — same pattern as the WFS tracker) =====
const CLOUD_CFG_KEY = "bigboss_cloud_cfg", CLOUD_CODE_KEY = "bigboss_cloud_code";
const CLIENT_ID = (()=>{ let c=localStorage.getItem("bigboss_client_id"); if(!c){ c=Date.now().toString(36)+Math.random().toString(36).slice(2,8); try{localStorage.setItem("bigboss_client_id",c);}catch(e){} } return c; })();
const FB_APP = "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js";
const FB_AUTH = "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js";
const FB_DB = "https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js";
let cloudDoc = null, cloudWriteTimer = null, cloudApplying = false;
async function cloudConnect(cfg, code){
  await loadScript(FB_APP); await loadScript(FB_AUTH); await loadScript(FB_DB);
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
  try { await firebase.auth().signInAnonymously(); } catch(e) { /* ok if rules are open */ }
  cloudDoc = firebase.database().ref("trackers/bigboss-" + code);
  cloudDoc.on("value", snap => {
    const v = snap.val();
    if (!v || !v.state || v.origin === CLIENT_ID) return;
    try {
      cloudApplying = true;
      const keepBiz = _state.activeBiz, keepTab = _state.activeTab;
      _state = JSON.parse(v.state);
      _state.activeBiz = keepBiz; _state.activeTab = keepTab; // don't yank this device's view around

// Pulls from the same centauri-wfs-data.json your WFS Profit Tracker
// auto-saves (Connect Folder once), from an exported tracker JSON, or a URL.
const WFS_FILE = "centauri-wfs-data.json";
const money = n => "$" + (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

// -- tiny IndexedDB store to persist the folder handle across sessions --
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("bigboss-fs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("handles");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) { const db = await idb(); return new Promise((res,rej)=>{ const t=db.transaction("handles","readwrite"); t.objectStore("handles").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res,rej)=>{ const t=db.transaction("handles","readonly"); const q=t.objectStore("handles").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }

async function connectWfsFolder() {
  if (!window.showDirectoryPicker) { ui.catStatus = "Folder connect needs Chrome, Edge, or Brave — use UPDATE to pick an exported JSON instead."; render(); return; }
  try {
    const h = await window.showDirectoryPicker({ mode: "read" });
    await idbSet("wfsdir", h);
    ui.catStatus = "Folder connected — click UPDATE to pull " + WFS_FILE;
  } catch(e) { if (e.name !== "AbortError") ui.catStatus = "Couldn't connect folder: " + e.message; }
  render();
}
async function readWfsFromFolder() {
  const h = await idbGet("wfsdir"); if (!h) return null;
  let perm = await h.queryPermission({ mode: "read" });
  if (perm !== "granted") perm = await h.requestPermission({ mode: "read" });
  if (perm !== "granted") return null;
  const fh = await h.getFileHandle(WFS_FILE);
  return JSON.parse(await (await fh.getFile()).text());
}
async function updateCatalog(biz) {
  ui.catStatus = "Updating…"; render();
  // 1) connected tracker folder (Centauri's WFS data file)
  if (biz === "centauri") {
    try { const data = await readWfsFromFolder(); if (data) return applyCatalog(biz, data, "connected folder"); }
    catch(e) { /* fall through */ }
  }
  // 2) configured URL
  const url = _state.catalogMeta[biz].srcUrl;
  if (url) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return applyCatalog(biz, await r.json(), "URL"); }
    catch(e) { /* fall through */ }
  }
  // 3) pick an exported tracker JSON
  ui.catStatus = "Pick your tracker JSON (Export button in the tracker, or " + WFS_FILE + ")";
  render();
  const inp = document.getElementById("catFile"); inp.dataset.biz = biz; inp.click();
}
function applyCatalog(biz, data, source) {

  _state.catalog[biz] = list.map(p => ({
    id: p.id || uid("prod"), name: p.name || "Unnamed product", brand: p.brand || "",
    sku: p.sku || "", itemid: p.itemid || "", gtin: p.gtin || "", url: p.url || "",
    price: Number(p.price)||0, margin: Number(p.margin)||0, qty: Number(p.qty)||0,
    estsales: Number(p.estsales)||0, listingscore: Number(p.listingscore)||0,
    status: p.status || "Published", notes: p.notes || "",
  }));
  const m = _state.catalogMeta[biz];
  m.lastSync = Date.now(); m.source = source;
  m.shipments = Array.isArray(data.shipments) ? data.shipments.length : 0;
  ui.catStatus = "✓ Pulled " + _state.catalog[biz].length + " product(s) from " + source;
  ui.editProd = null; ui.showForm = {};

function saveProd(biz, id){

  const obj = { name, brand:g("brand"), sku:g("sku"), price:num("price"), margin:num("margin"),
    qty:num("qty"), listingscore:num("lqs"), estsales:num("estsales"),

function daysUntil(d){ return Math.ceil((new Date(d+"T23:59:59") - new Date())/86400000); }
function rDeadlines(biz) {
  const rows=_state.deadlines.filter(d=>d.biz===biz).sort((a,b)=>a.date.localeCompare(b.date));
  let html = `<div class="section-title">⏰ DEADLINES &amp; REMINDERS — ${BIZ[biz].name}</div>`;
  if (ui.showForm.dl) {
    html += `<div class="form-panel">

      <div class="grid2"><input id="dl-date" type="date"><input id="dl-note" placeholder="Note (optional)"></div>
      <div class="row"><button class="btn btn-red" style="flex:1" onclick="addDl('${biz}')">💾 SAVE DEADLINE</button>
      <button class="btn btn-ghost" onclick="ui.showForm.dl=false;render()">CANCEL</button></div></div>`;
  } else {
    html += `<button class="btn-dashed" style="margin-bottom:12px" onclick="ui.showForm.dl=true;render()">➕ ADD DEADLINE</button>`;
  }
  if (!rows.length) html += `<div class="empty">No deadlines tracked for ${BIZ[biz].short}.</div>`;
  html += `<div class="col">` + rows.map(d=>{
    const n=daysUntil(d.date);
    const badge = d.done ? `<span class="chip" style="background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.4)">DONE</span>`
      : n<0 ? `<span class="chip" style="background:rgba(239,68,68,0.14);color:#ef4444;border:1px solid rgba(239,68,68,0.4)">${-n}D OVERDUE</span>`
      : n===0 ? `<span class="chip" style="background:rgba(245,158,11,0.15);color:var(--amber);border:1px solid rgba(245,158,11,0.4)">TODAY</span>`
      : `<span class="chip" style="background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.4)">IN ${n}D</span>`;
    return `<div class="card" style="padding:13px 16px;display:flex;align-items:center;gap:12px;${d.done?'opacity:0.55':''}">
      <div onclick="toggleDl('${d.id}')" title="Toggle done" style="width:22px;height:22px;border-radius:6px;border:1px solid ${d.done?'var(--green)':'rgba(255,255,255,0.15)'};display:flex;align-items:center;justify-content:center;color:var(--green);cursor:pointer;flex-shrink:0">${d.done?"✓":""}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;color:#e2e8f0;margin-bottom:2px;${d.done?'text-decoration:line-through':''}">${esc(d.title)}</div>
        <div style="font-size:13px;color:#8794ab">${new Date(d.date+"T12:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}${d.note?` · ${esc(d.note)}`:''}</div>
      </div>
      ${badge}<button class="del-x" onclick="delDl('${d.id}')">×</button>
    </div>`;
  }).join("") + `</div>`;
  return html;
}
function addDl(biz){
  const t=document.getElementById("dl-title").value.trim(), dt=document.getElementById("dl-date").value;

  _state.deadlines.push({ id:uid("dl"), biz, title:t, date:dt, note:document.getElementById("dl-note").value.trim(), done:false });

// between the dashboard and those modules: it picks files, runs the pipeline,

function loadScript(src){
  return new Promise((res,rej)=>{
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script"); s.src = src;
    s.onload = res; s.onerror = ()=>rej(new Error("couldn't load " + src.split("/").pop() + " (check internet)"));
    document.head.appendChild(s);
  });
}

async function runAutofill(file, biz, mode){
  if (!window.DOCAI || !DOCAI.pipeline){

  }
  DOCAI.reviewUI.close();
  ui.afResults = null;
  try {
    const proposal = await DOCAI.pipeline.run(file, {
      state: _state,
      profiles: docaiProfiles(),
      onStatus: (msg) => { ui.afStatus = msg; render(); }
    });
    ui.afStatus = null;
    DOCAI.reviewUI.lastCtx = docaiCtx();
    DOCAI.reviewUI.open(proposal, DOCAI.reviewUI.lastCtx);
    ui.afReview = true;
    // Only Strength and Financials render the review panel. If the import was
    // started from anywhere else, move to Strength — an active review that is
    // invisible is worse than a tab change.
    if (_state.activeTab !== "strength" && _state.activeTab !== "financials") _state.activeTab = "strength";
    render();
  } catch(e){
    ui.afStatus = "Couldn't read that file: " + e.message;

async function docaiAnalyzeLink(biz, pastedText){
  if (!window.DOCAI || !DOCAI.linkPipeline){
    ui.webLinkError = "The link engine didn't load — check that js/doc is present."; render(); return;
  }
  const input = document.getElementById("wl-url");
  const raw = pastedText ? (ui.webLinkLastUrl || "") : ((input ? input.value : ui.webLinkTyped) || "");
  const check = DOCAI.linkUrl.normalize(raw);
  if (!check.ok){
    ui.webLinkError = check.reason + (check.detail ? " " + check.detail : "");
    render(); return;
  }
  ui.webLinkError = null;
  ui.webLinkLastUrl = check.url;
  ui.showForm.weblink = false;
  DOCAI.reviewUI.close();

  try {
    const proposal = await DOCAI.linkPipeline.run(check.url, {
      state: _state,
      profiles: docaiProfiles(),
      pastedText: pastedText || null,
      onStatus: (msg) => { ui.afStatus = msg; render(); }
    });
    ui.afStatus = null;
    const ctx = docaiCtx();
    // Re-running with pasted text keeps the user inside the same review.
    ctx.onPasted = (url, text) => { ui.webLinkLastUrl = url; docaiAnalyzeLink(biz, text); };
    DOCAI.reviewUI.lastCtx = ctx;
    DOCAI.reviewUI.open(proposal, ctx);
    ui.afReview = true;
    if (_state.activeTab !== "strength" && _state.activeTab !== "financials") _state.activeTab = "strength";
    render();
  } catch(e){
    ui.afStatus = null;
    ui.webLinkError = "Couldn't analyze that link: " + e.message;
    ui.showForm.weblink = true;
    render();
  }
}

async function docaiRecheckLink(biz, id){
  const rec = DOCAI.linkStore.list(_state, biz).find(r=>r.id===id);
  if (!rec) return;
  ui.docStatus = "Rechecking " + DOCAI.linkUrl.display(rec.finalUrl||rec.url, 50) + "…"; render();
  try {
    const out = await DOCAI.linkPipeline.recheck(rec, { onStatus:(m)=>{ ui.docStatus=m; render(); } });
    DOCAI.linkStore.recordCheck(rec, {
      at: out.at, status: out.status, note: out.note, httpStatus: out.httpStatus,
      finalUrl: out.finalUrl, changed: out.changed,
      // Only adopt a new hash when the page was actually read.
      contentHash: out.ok ? out.contentHash : ""
    });
    if (out.ok && out.changed){
      ui.docStatus = "⚠ “" + (rec.title||rec.url) + "” has changed since it was saved. " +
        "Nothing was altered — run Autofill from Link again to review the new values.";
    } else if (out.ok){
      ui.docStatus = "✓ " + out.note;
    } else {
      ui.docStatus = (out.gone ? "⚠ That page is gone (" + out.httpStatus + "). " : "⚠ ") + out.note +
        " The saved record and its evidence were kept.";
    }
    save(); render();
  } catch(e){
    ui.docStatus = "Recheck failed: " + e.message; render();
  }
}

function docaiRemoveLink(biz, id){
  const list = DOCAI.linkStore.list(_state, biz);
  const rec = list.find(r=>r.id===id);
  if (!rec) return;
  const fields = DOCAI.linkStore.dependentFields(rec);
  let msg = "Remove this saved web source?\n\n" + (rec.title || rec.url);
  if (fields.length){
    // Removing the source does not remove what it supported — say so, so the
    // choice is made knowing the values stay behind without their evidence.
    msg += "\n\nIt is the recorded source for " + fields.length + " saved field(s):\n" +
      fields.map(d=>"  · " + DOCAI.mapping.label(d)).join("\n") +
      "\n\nThose values and any other supporting documents will be KEPT. Only this link record is removed.";
  }
  if (!confirm(msg)) return;
  _state.docs[biz].web = list.filter(r=>r.id!==id);
  // Detach it from any strength checkpoint it was attached to.
  Object.keys(_state.strengthFiles[biz]||{}).forEach(cp=>{
    const left = (_state.strengthFiles[biz][cp]||[]).filter(f=>f.linkOf!==id);

  });
  if (rec.textRef) DOCAI.linkStore.deleteText(rec.textRef);
  ui.docStatus = "Removed the web source. The field values it supported were kept.";
  commit();
}

function addStrengthFiles(fileList, biz, k){
  const files=[...fileList]; if(!files.length) return;
  const arr = (_state.strengthFiles[biz][k] ||= []);
  let pending=files.length;
  files.forEach(f=>{
    const entry={ id:uid("skf"), name:f.name||"attachment", type:f.type||"", size:f.size, ts:Date.now(), dataUri:null, ref:false };
    const fin=()=>{ if(--pending===0){ try{save();}catch(e){ ui.docStatus="Storage full — some files kept as reference only."; } render(); } };
    if (f.size > 3*1048576){ entry.ref=true; arr.push(entry); fin(); return; }
    const r=new FileReader();
    r.onload=()=>{ entry.dataUri=r.result; arr.push(entry); fin(); };
    r.readAsDataURL(f);
  });
}

// Centauri World logo (SVG recreation: blue dot-sphere globe + wordmark)
function centauriGlobeDots() {
  // regular dot lattice clipped to a sphere, with a circular cut-out on the
  // right that carves the crescent "C" — dots swell toward the sphere's center
  let dots = "";
  const cx=60, cy=60, R=47, step=6.9;
  const kx=cx+R*0.62, kr=R*0.78;
  let row=0;
  for (let y=cy-R+4; y<=cy+R-3; y+=step, row++) {
    const off=(row%2)*step/2;
    for (let x=cx-R+2+off; x<=cx+R; x+=step) {
      const r=Math.hypot(x-cx,y-cy);
      if (r>R-2) continue;                      // outside sphere
      if (Math.hypot(x-kx,y-cy)<kr) continue;    // inside cut-out → crescent
      const s=1.0+2.9*Math.sqrt(Math.max(0,1-(r/R)*(r/R)));
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(2)}" fill="#1A6AE8"/>`;
    }
  }
  return dots;
}

async function connectDocsFolder(biz) {
  if (!window.showDirectoryPicker) { ui.docStatus="Folder connect needs Chrome, Edge, or Brave."; render(); return; }
  try {
    const h = await window.showDirectoryPicker({ mode: "read" });
    await idbSet("docs-"+biz, h);
    _state.docs[biz].scan.folderName = h.name;
    ui.docStatus = "Folder \""+h.name+"\" connected — click ⟳ UPDATE to pull the file list.";
    commit(); return;
  } catch(e) { if (e.name!=="AbortError") ui.docStatus="Couldn't connect folder: "+e.message; }
  render();
}
async function scanDocs(biz) {
  ui.docStatus = "Scanning…"; render();
  try {
    const h = await idbGet("docs-"+biz);
    if (!h) { ui.docStatus="No folder connected yet — click ◇ CONNECT OBSIDIAN FOLDER first."; render(); return; }
    let perm = await h.queryPermission({mode:"read"});
    if (perm!=="granted") perm = await h.requestPermission({mode:"read"});
    if (perm!=="granted") { ui.docStatus="Folder permission was denied."; render(); return; }
    const files = [];
    for await (const entry of h.values()) {
      if (entry.kind!=="file") continue;
      const f = await entry.getFile();
      files.push({ name:f.name, size:f.size, mtime:f.lastModified });
      if (files.length>=300) break;
    }
    files.sort((a,b)=>b.mtime-a.mtime);
    _state.docs[biz].scan = { files, lastScan: Date.now(), folderName: h.name };
    ui.docStatus = "✓ Pulled "+files.length+" file(s) from \""+h.name+"\"";
    commit();
  } catch(e) { ui.docStatus="Scan failed: "+e.message; render(); }
}
async function openScanFile(biz, idx) {
  try {
    const h = await idbGet("docs-"+biz);
    const meta = _state.docs[biz].scan.files[idx];
    const fh = await h.getFileHandle(meta.name);
    const f = await fh.getFile();
    window.open(URL.createObjectURL(f), "_blank");
  } catch(e) { ui.docStatus="Couldn't open file: "+e.message; render(); }
}
async function autofillFromScan(biz, idx){
  try {
    const h = await idbGet("docs-"+biz);
    const meta = _state.docs[biz].scan.files[idx];
    const f = await (await h.getFileHandle(meta.name)).getFile();
    _state.activeTab = "strength";   // the review panel renders here
    runAutofill(f, biz);
  } catch(e){ ui.docStatus = "Couldn't read that file: " + e.message; render(); }
}
function pickDocFiles(biz){ const i=document.getElementById("docFile"); i.dataset.biz=biz; i.click(); }
function addDocFiles(fileList, biz) {
  const files=[...fileList]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const entry={ id:uid("doc"), name:f.name||("screenshot-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".png"),
      type:f.type||"", size:f.size, ts:Date.now(), dataUri:null, ref:false };
    if (f.size > 3*1048576) { entry.ref=true; _state.docs[biz].files.unshift(entry); if(--pending===0) finishDocAdd(biz,files.length); return; }
    const r=new FileReader();
    r.onload=()=>{ entry.dataUri=r.result; _state.docs[biz].files.unshift(entry); if(--pending===0) finishDocAdd(biz,files.length); };
    r.readAsDataURL(f);
  });
}
function finishDocAdd(biz,n){
  try { save(); ui.docStatus="✓ Saved "+n+" file(s)."; }
  catch(e){ ui.docStatus="Storage is full — file kept as reference only. Delete some saved files to free space."; }
  render();
}
function renameDocFile(biz,id){
  const f=_state.docs[biz].files.find(x=>x.id===id); if(!f) return;
  const n=prompt("Rename file:", f.name);
  if(n && n.trim()){ f.name=n.trim(); commit(); }
}
function delDocFile(biz,id){
  const f=_state.docs[biz].files.find(x=>x.id===id);
  _state.docs[biz].files=_state.docs[biz].files.filter(x=>x.id!==id);
  // Drop the stored blob and its extracted text alongside the record.
  if (f && f.blobId && window.DOCAI){
    DOCAI.store.deleteBlob(f.blobId).catch(()=>{});
    if (f.textRef) DOCAI.store.deleteText(f.textRef).catch(()=>{});
  }
  commit();
}
function openSavedDoc(biz,id){
  const f=_state.docs[biz].files.find(x=>x.id===id);
  if(!f) return;
  // Imported documents keep their blob in IndexedDB; files saved by the older
  // path keep a base64 dataUri in state. Both are opened here.
  if (f.blobId && window.DOCAI){
    DOCAI.store.getBlob(f.blobId).then(b=>{
      if(!b){ ui.docStatus="\""+f.name+"\" is no longer in document storage."; render(); return; }
      window.open(DOCAI.util.objectUrl(b),"_blank");
    }).catch(e=>{ ui.docStatus="Couldn't open that document: "+e.message; render(); });
    return;
  }
  if(!f.dataUri){ ui.docStatus="\""+f.name+"\" was too big to store — it's listed as a reference only."; render(); return; }
  fetch(f.dataUri).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(new Blob([b],{type:f.type||b.type})),"_blank"));
}
function addDocLink(biz){
  const url=document.getElementById("dk-url").value.trim(); if(!url) return;
  const label=document.getElementById("dk-label").value.trim();
  const bucket=document.getElementById("dk-dnb").checked?"dnb":"links";
  _state.docs[biz][bucket].push({ id:uid("lnk"), label, url: /^https?:\/\//i.test(url)?url:"https://"+url });
  ui.showForm.dlink=false; commit();
}
function delDocLink(biz,bucket,id){ _state.docs[biz][bucket]=_state.docs[biz][bucket].filter(l=>l.id!==id); commit(); }

/* === drag-and-drop into Saved Files (added) === */
(function(){function onP(){try{return _state.activeTab==="strength";}catch(e){return false;}}function hasF(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>=0;}function cue(o){document.body.style.outline=o?"3px dashed #f5b301":"";document.body.style.outlineOffset=o?"-10px":"";}window.addEventListener("dragover",function(e){if(onP()&&hasF(e)){e.preventDefault();try{e.dataTransfer.dropEffect="copy";}catch(_){}cue(true);}});window.addEventListener("dragleave",function(e){if(e.relatedTarget===null)cue(false);});window.addEventListener("dragend",function(){cue(false);});window.addEventListener("drop",function(e){if(onP()&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();cue(false);addDocFiles(e.dataTransfer.files,_state.activeBiz);}});})();

function exportData(){
  const blob = new Blob([JSON.stringify(_state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "big-business-data-" + new Date().toISOString().slice(0,10) + ".json";

document.getElementById("dataFile").addEventListener("change", e=>{

      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(input)
    });
    if(!res.ok){
      var txt = await res.text().catch(function(){return "";});
      throw new Error("Apify error " + res.status + (txt ? (": " + txt.slice(0,180)) : ""));
    }
    return await res.json();
  }

  function pickSocials(it){
    var s = {};
    var grab = function(arr){ return (arr && arr.length) ? arr[0] : ""; };
    if(it.linkedIns) s.LinkedIn = grab(it.linkedIns);
    if(it.facebooks) s.Facebook = grab(it.facebooks);
    if(it.instagrams) s.Instagram = grab(it.instagrams);
    if(it.twitters) s.X = grab(it.twitters);
    if(it.youtubes) s.YouTube = grab(it.youtubes);
    if(it.tiktoks) s.TikTok = grab(it.tiktoks);
    return s;
  }
  function normMaps(it){
    if(!it) return null;
    var addr = it.address || [it.street, it.city, it.state, it.postalCode].filter(Boolean).join(", ");
    return {
      name: it.title || "",
      role: it.categoryName || "Business",
      phone: it.phone || it.phoneUnformatted || "",
      email: (it.emails && it.emails[0]) || "",
      website: it.website || "",
      address: addr || "",
      socials: pickSocials(it)
    };
  }
  function normSite(it, fallbackUrl){
    if(!it) return null;
    var phones = (it.phones && it.phones.length ? it.phones : it.phonesUncertain) || [];
    return {
      name: "",
      role: "Business",
      phone: phones[0] || "",
      email: (it.emails && it.emails[0]) || "",
      website: it.originalStartUrl || it.domain || fallbackUrl || "",
      address: "",
      socials: pickSocials(it)
    };
  }
  function buildNotes(d){
    var lines = [];
    if(d.website) lines.push("Website: " + d.website);
    if(d.address) lines.push("Address: " + d.address);
    var soc = Object.keys(d.socials || {}).filter(function(k){ return d.socials[k]; });
    soc.forEach(function(k){ lines.push(k + ": " + d.socials[k]); });
    return lines.join("  |  ");
  }

  function ensureContactForm(){
    try{
      if(window.ui && window.ui.showForm){
        window.ui.showForm.ct = true;
        if(typeof window.render === "function") window.render();
      }
    }catch(e){}
  }
  function setField(id, val){
    var el = $(id);
    if(el && val){
      el.value = val;
      el.classList.add("bbaf-filled");
      setTimeout(function(){ el.classList.remove("bbaf-filled"); }, 1500);
      return true;
    }
    return false;
  }
  function fillContact(d){
    ensureContactForm();
    if(!$("ct-name")) return false;
    setField("ct-name",  d.name);
    setField("ct-role",  d.role);
    setField("ct-phone", d.phone);
    setField("ct-email", d.email);
    setField("ct-notes", buildNotes(d));
    return true;
  }

  async function autofill(){
    var raw = ($("bbaf-url").value || "").trim();
    if(!raw){ status("Paste a link first."); return; }
    if(!getToken()){ status("Add your Apify token below first."); return; }

    var isMaps = isMapsUrl(raw);
    status((isMaps ? "Reading Google Maps listing" : "Reading website") + "… (10–40s)");

    try{
      var items, data;
      if(isMaps){
        items = await runActor(MAPS_ACTOR, {
          startUrls: [{ url: raw }],
          maxCrawledPlacesPerSearch: 1,
          scrapeContacts: true,
          language: "en",
          maxReviews: 0, maxImages: 0
        });
        data = normMaps(items && items[0]);
      } else {
        items = await runActor(SITE_ACTOR, {
          startUrls: [{ url: raw }],
          maxDepth: 1,
          maxRequestsPerStartUrl: 10,
          mergeContacts: true,
          proxyConfig: { useApifyProxy: true }
        });
        data = normSite(items && items[0], raw);
      }

      if(!data){ status("Nothing found for that link. Try the other type of link."); return; }

      var ok = fillContact(data);
      if(ok){
        status("✓ Filled: " + (data.name || data.website || "contact") +
               ".\nReview the fields, then click 💾 SAVE CONTACT.");
      } else {
        status("Found it, but no contact form is open.\nOpen a business → Contacts → new contact, then Autofill again.\n\n" +
               [data.name && ("Name: "+data.name),
                data.phone && ("Phone: "+data.phone),
                data.email && ("Email: "+data.email),
                data.website && ("Web: "+data.website),
                data.address && ("Addr: "+data.address)
               ].filter(Boolean).join("\n"));
      }
    }catch(err){
      var m = String(err && err.message || err);
      if(/Failed to fetch|CORS|NetworkError/i.test(m)){
        status("Network/CORS blocked the request.\nTell Claude and we'll switch to the tiny proxy version.");
      } else {
        status("⚠ " + m);
      }
    }
  }

  /* ---------- wire up ---------- */
  function init(){
    injectStyles();
    injectUI();
    $("bbaf-fab").addEventListener("click", function(){
      var p = $("bbaf-panel");
      p.style.display = (p.style.display === "block") ? "none" : "block";
      $("bbaf-tokwrap").classList.toggle("hidden", !!getToken());
      if(getToken()) $("bbaf-token").value = "";
    });
    $("bbaf-go").addEventListener("click", autofill);
    $("bbaf-url").addEventListener("keydown", function(e){ if(e.key === "Enter") autofill(); });
    $("bbaf-savetok").addEventListener("click", function(){
      var t = ($("bbaf-token").value || "").trim();
      if(!t){ status("Paste your token first."); return; }
      setToken(t);
      $("bbaf-tokwrap").classList.add("hidden");
      status("✓ Token saved on this device.");
    });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }
})();

</script>
</body>
</html>
